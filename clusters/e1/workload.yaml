# HISTORICAL CLOUDSTACK QUALIFICATION ONLY.
# Current LayerSentry RKE2 catalog selection starts at catalog/v1/catalog.json.
# Keep this reconciliation suspended so obsolete CloudStack CCM/CSI material cannot be applied accidentally.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ${CLUSTER_NAME}-workload
  namespace: ${CLUSTER_NAMESPACE}
spec:
  suspend: true
  interval: 10m
  retryInterval: 1m
  timeout: 15m
  path: ./workload
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: layersentry-e1-catalog
    namespace: flux-system
  kubeConfig:
    secretRef:
      name: ${CLUSTER_NAME}-kubeconfig
      key: value
