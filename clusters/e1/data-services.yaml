apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ${CLUSTER_NAME}-data-services
  namespace: ${CLUSTER_NAMESPACE}
spec:
  dependsOn:
    - name: ${CLUSTER_NAME}-workload
  interval: 10m
  retryInterval: 1m
  timeout: 30m
  path: ./apps/data-services
  prune: false
  wait: true
  sourceRef:
    kind: GitRepository
    name: layersentry-e1-catalog
    namespace: flux-system
  kubeConfig:
    secretRef:
      name: ${CLUSTER_NAME}-kubeconfig
      key: value
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: ${CLUSTER_NAME}-site-config
        # DBaaS production inputs are mandatory. For offline environments this
        # ConfigMap also supplies LAYERSENTRY_OPENEVEREST_HELM_GIT_URL. Missing
        # configuration must stop reconciliation rather than fall back to an
        # Internet source.
        optional: false
