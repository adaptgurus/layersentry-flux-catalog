apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: layersentry-dbaas-provider
  namespace: everest-system
  labels:
    app.kubernetes.io/part-of: layersentry-dbaas
spec:
  interval: 30m
  timeout: 20m
  releaseName: everest
  targetNamespace: everest-system
  chart:
    spec:
      # Use the pre-packaged chart from the signed private Git mirror. This
      # avoids any runtime dependency-resolution against public Helm repos.
      chart: ./packages/openeverest-1.16.2.tgz
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: openeverest-helm
        namespace: everest-system
      interval: 30m
  install:
    crds: CreateReplace
    remediation:
      retries: 2
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 2
      strategy: rollback
  rollback:
    cleanupOnFail: true
    recreate: false
  uninstall:
    keepHistory: true
  driftDetection:
    mode: enabled
  valuesFrom:
    - kind: ConfigMap
      name: layersentry-openeverest-values
      valuesKey: values.yaml
    - kind: ConfigMap
      name: layersentry-openeverest-site-values
      valuesKey: values.yaml
      optional: true
