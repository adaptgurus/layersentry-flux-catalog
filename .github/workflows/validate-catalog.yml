name: Validate provider-neutral Kubernetes catalog
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate catalog policy
        run: |
          python3 scripts/validate_catalog.py catalog/v1/catalog.json
          python3 -m unittest discover -s tests -v
      - name: Install pinned Cosign verifier
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.1.2
      - name: Verify cert-manager OCI chart, PGP provenance and image signatures
        shell: bash
        run: |
          set -euo pipefail
          command -v helm
          command -v cosign
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          keyring="$tmp/cert-manager-keyring.gpg"
          image_key="$tmp/cert-manager-pubkey.pem"
          curl --proto '=https' --tlsv1.2 -fsSL \
            https://cert-manager.io/public-keys/cert-manager-keyring-2021-09-20-1020CF3C033D4F35BAE1C19E1226061C665DF13E.gpg \
            -o "$keyring"
          curl --proto '=https' --tlsv1.2 -fsSL \
            https://cert-manager.io/public-keys/cert-manager-pubkey-2021-09-20.pem \
            -o "$image_key"

          expected_chart="sha256:15c0b46d9006ce8eb9ff14d1bf54d1bbfcc587bb9e24cd9fe186fb8fec56af1f"
          output="$(helm pull oci://quay.io/jetstack/charts/cert-manager \
            --version v1.21.1 --verify --keyring "$keyring" --destination "$tmp" 2>&1)"
          printf '%s\n' "$output"
          actual_chart="$(printf '%s\n' "$output" | awk '/^Digest:/ {print $2}' | tail -1)"
          test "$actual_chart" = "$expected_chart"

          python3 - <<'PY' > "$tmp/images.txt"
          import json
          data=json.load(open('catalog/v1/catalog.json'))
          for image in data['entries'][0]['airGapArtifacts']['images']:
              print(image['immutableRef'])
          PY
          while IFS= read -r image; do
            cosign verify \
              --signature-digest-algorithm sha512 \
              --insecure-ignore-tlog \
              --key "$image_key" \
              "$image" >/dev/null
          done < "$tmp/images.txt"

          python3 - <<'PY' > "$tmp/digest-values.txt"
          import json
          data=json.load(open('catalog/v1/catalog.json'))
          values=data['entries'][0]['install']['values']
          for key in ('image.digest','webhook.image.digest','cainjector.image.digest','acmesolver.image.digest','startupapicheck.image.digest'):
              print(f'--set={key}={values[key]}')
          PY
          mapfile -t digest_values < "$tmp/digest-values.txt"
          helm template cert-manager "oci://quay.io/jetstack/charts/cert-manager@${expected_chart}" \
            --namespace cert-manager \
            --set=crds.enabled=true \
            --set=crds.keep=true \
            "${digest_values[@]}" > "$tmp/rendered.yaml"
          while IFS= read -r image; do
            digest="${image##*@}"
            grep -F -- "$digest" "$tmp/rendered.yaml" >/dev/null
          done < "$tmp/images.txt"
