name: Discover cert-manager 1.21.2 immutable artifacts
on:
  push:
    branches:
      - layersentry/t6-k8s-catalog-prod-20260911
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Resolve official immutable artifacts
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          keyring="$tmp/cert-manager-keyring.gpg"
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 -fsSL \
            https://cert-manager.io/public-keys/cert-manager-keyring-2021-09-20-1020CF3C033D4F35BAE1C19E1226061C665DF13E.gpg \
            -o "$keyring"
          echo '=== CHART ==='
          output="$(helm pull oci://quay.io/jetstack/charts/cert-manager --version v1.21.2 --verify --keyring "$keyring" --destination "$tmp" 2>&1)"
          printf '%s\n' "$output"
          chart="$(find "$tmp" -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          echo "PACKAGE_DIGEST=sha256:$(sha256sum "$chart" | awk '{print $1}')"
          echo '=== IMAGES ==='
          for image in \
            quay.io/jetstack/cert-manager-controller:v1.21.2 \
            quay.io/jetstack/cert-manager-webhook:v1.21.2 \
            quay.io/jetstack/cert-manager-cainjector:v1.21.2 \
            quay.io/jetstack/cert-manager-acmesolver:v1.21.2 \
            quay.io/jetstack/cert-manager-startupapicheck:v1.21.2; do
            echo "IMAGE=$image"
            docker buildx imagetools inspect "$image" | sed -n '1,8p'
          done
